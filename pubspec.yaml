publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.3+1
  http: ^1.2.1
  gal: ^2.3.0
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  responsive_framework: ^1.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1
  window_manager: ^0.3.9
  flutter_spinkit: ^5.2.1
  uuid: ^4.3.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
